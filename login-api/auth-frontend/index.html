<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Nest Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f2f2f2;
}

/* CENTER WRAPPER */
.wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

/* MAIN CARD */
.container{
  width:100%;
  max-width:1100px;
  background:white;
  border-radius:25px;
  display:flex;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

/* LEFT IMAGE */
.left{
  flex:1;
  min-height:520px;
  background:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover no-repeat;
}

/* RIGHT FORM */
.right{
  flex:1;
  padding:60px 50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

h1{
  font-size:26px;
  color:#1d2b6c;
  margin-bottom:5px;
}

small{
  color:gray;
  margin-bottom:25px;
  display:block;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  font-size:14px;
  margin-bottom:6px;
  display:block;
}

.input-group input{
  width:100%;
  padding:13px 16px;
  border-radius:30px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none;
  transition:0.2s;
}

.input-group input:focus{
  border-color:#4a90e2;
  box-shadow:0 0 6px rgba(74,144,226,0.3);
}

.options{
  text-align:right;
  margin-bottom:20px;
  font-size:13px;
}

.options a{
  color:#4a90e2;
  text-decoration:none;
  cursor:pointer;
}

.main-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:30px;
  background:linear-gradient(to right,#4a90e2,#357ABD);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}

.main-btn:hover{
  transform:translateY(-1px);
  opacity:0.95;
}

.secondary-btn{
  width:100%;
  padding:11px;
  border-radius:30px;
  border:1px solid #ddd;
  background:white;
  margin-top:10px;
  cursor:pointer;
}

.toggle-text{
  text-align:center;
  margin-top:18px;
  font-size:14px;
}

.toggle-text span{
  color:#4a90e2;
  font-weight:500;
  cursor:pointer;
}

#signupForm,
#forgotForm{
  display:none;
}

/* MOBILE RESPONSIVE */
@media(max-width:900px){

  .container{
    flex-direction:column;
    border-radius:20px;
  }

  .left{
    min-height:220px;
  }

  .right{
    padding:30px 25px;
  }

  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

  <div class="left"></div>

  <div class="right">

    <!-- LOGIN -->
    <form id="loginForm">
      <h1>Welcome Back!</h1>
      <small>Sign in your account</small>

      <div class="input-group">
        <label>Email</label>
        <input type="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" required>
      </div>

      <div class="options">
        <a onclick="showForgot()">Forgot Password?</a>
      </div>

      <button type="submit" class="main-btn">Login</button>

      <div class="toggle-text">
        Don't have an account?
        <span onclick="showSignup()">Register</span>
      </div>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm">
      <h1>Create Account</h1>
      <small>Register new account</small>

      <div class="input-group">
        <label>Name</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>Surname</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" required>
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" required>
      </div>

      <button type="submit" class="main-btn">Sign Up</button>

      <div class="toggle-text">
        Already have account?
        <span onclick="showLogin()">Login</span>
      </div>
    </form>

    <!-- FORGOT -->
    <form id="forgotForm">
      <h1>Forgot Password</h1>
      <small>Enter email → Verify OTP → Set new password</small>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="forgotEmail" required>
      </div>

      <button type="button" class="main-btn" onclick="sendOTP()">Send OTP</button>

      <div id="otpSection" style="display:none;">
        <div class="input-group">
          <label>Enter OTP</label>
          <input type="text" id="otpInput">
        </div>
        <button type="button" class="main-btn" onclick="verifyOTP()">Verify OTP</button>
      </div>

      <div id="newPassSection" style="display:none;">
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="newPassword">
        </div>
        <button type="button" class="main-btn" onclick="resetPassword()">Reset Password</button>
      </div>

      <button type="button" class="secondary-btn" onclick="showLogin()">Back to Login</button>
    </form>

  </div>

</div>
</div>

<script>
const API_BASE_URL = "https://login-api-m00t.onrender.com";

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const forgotForm = document.getElementById("forgotForm");

function showSignup(){
  loginForm.style.display="none";
  forgotForm.style.display="none";
  signupForm.style.display="block";
}

function showLogin(){
  signupForm.style.display="none";
  forgotForm.style.display="none";
  loginForm.style.display="block";
}

function showForgot(){
  loginForm.style.display="none";
  signupForm.style.display="none";
  forgotForm.style.display="block";
}

function showMessage(msg){
  alert(msg);
}

loginForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = loginForm.querySelector('input[type="email"]').value;
  const password = loginForm.querySelector('input[type="password"]').value;

  const res = await fetch(`${API_BASE_URL}/login`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });

  const data = await res.json();
  showMessage(data.message || data.error);
});

signupForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const inputs = signupForm.querySelectorAll("input");

  const res = await fetch(`${API_BASE_URL}/signup`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:inputs[0].value,
      surname:inputs[1].value,
      email:inputs[2].value,
      phone_number:inputs[3].value,
      password:inputs[4].value
    })
  });

  const data = await res.json();
  showMessage(data.message || data.error);
});

async function sendOTP(){
  const res = await fetch(`${API_BASE_URL}/forgot-password`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:forgotEmail.value})
  });
  const data = await res.json();
  showMessage(data.message || data.error);
  if(res.ok) otpSection.style.display="block";
}

function verifyOTP(){
  newPassSection.style.display="block";
  showMessage("OTP Verified");
}

async function resetPassword(){
  const res = await fetch(`${API_BASE_URL}/reset-password`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      email:forgotEmail.value,
      otp:otpInput.value,
      new_password:newPassword.value
    })
  });
  const data = await res.json();
  showMessage(data.message || data.error);
  if(res.ok){
    showLogin();
    forgotForm.reset();
    otpSection.style.display="none";
    newPassSection.style.display="none";
  }
}
</script>

</body>
</html>
