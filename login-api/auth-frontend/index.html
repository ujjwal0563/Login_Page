<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Nest Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

.wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:450px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:35px 30px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
  color:white;
}

.message-box{
  padding:10px 15px;
  border-radius:10px;
  font-size:14px;
  margin-bottom:15px;
  display:none;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.3);
  color:white;
}

.input-group{
  margin-bottom:15px;
}

.input-group label{
  font-size:13px;
  display:block;
  margin-bottom:5px;
}

.input-group input{
  width:100%;
  padding:12px 15px;
  border-radius:25px;
  border:none;
  outline:none;
  font-size:14px;
}

.main-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:white;
  color:#333;
  cursor:pointer;
  margin-top:5px;
  transition:0.2s;
}

.main-btn:hover{
  transform:translateY(-2px);
}

.secondary-btn{
  width:100%;
  padding:10px;
  border-radius:25px;
  border:1px solid white;
  background:transparent;
  color:white;
  margin-top:10px;
  cursor:pointer;
}

.toggle-text{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.toggle-text span{
  color:#8cc8ff;
  cursor:pointer;
  font-weight:500;
}

#signupForm,
#forgotForm{
  display:none;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="https://media.istockphoto.com/id/1315388795/video/flying-through-emerging-digital-structures-blue-loopable-data-network-virtual-reality-quantum.mp4?s=mp4-640x640-is&k=20&c=YOcxqKZzmSRYHCTkzQgtAKAKGC6E1L5QWNB7ecOspnk=" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="wrapper">
<div class="card">

<div id="messageBox" class="message-box"></div>

<!-- LOGIN -->
<form id="loginForm">
<h1>Login</h1>

<div class="input-group">
<label>Email</label>
<input type="email" id="loginEmail" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="loginPassword" required>
</div>

<button type="submit" class="main-btn">Login</button>

<div class="toggle-text">
Don't have account?
<span onclick="showSignup()">Register</span>
</div>

<div class="toggle-text">
<span onclick="showForgot()">Forgot Password?</span>
</div>
</form>

<!-- SIGNUP -->
<form id="signupForm">
<h1>Register</h1>

<div class="input-group">
<label>Name</label>
<input type="text" id="signupName" required>
</div>

<div class="input-group">
  <label>Username</label>
  <input type="text" id="signupUsername" required>  
</div>
 
<div class="input-group">
<label>Phone</label>
<input type="text" id="signupPhone" required>
</div>


<div class="input-group">
<label>Email</label>
<input type="email" id="signupEmail" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="signupPassword" required>
</div>

<button type="submit" class="main-btn">Register</button>

<div class="toggle-text">
Already have account?
<span onclick="showLogin()">Login</span>
</div>
</form>

<!-- FORGOT PASSWORD -->
<form id="forgotForm">
<h1>Reset Password</h1>

<div class="input-group">
<label>Email</label>
<input type="email" id="forgotEmail" required>
</div>

<button type="button" class="main-btn" onclick="sendOTP()">Send OTP</button>

<div id="otpSection" style="display:none;">
<div class="input-group">
<label>Enter OTP</label>
<input type="text" id="otpInput">
</div>
</div>

<div id="newPassSection" style="display:none;">
<div class="input-group">
<label>New Password</label>
<input type="password" id="newPassword">
</div>
<button type="button" class="main-btn" onclick="resetPassword()">Update Password</button>
</div>

<button type="button" class="secondary-btn" onclick="showLogin()">Back</button>
</form>

</div>
</div>

<script>
const API_BASE_URL="https://login-api-m00t.onrender.com";

const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");
const forgotForm=document.getElementById("forgotForm");
const messageBox=document.getElementById("messageBox");

function showMessage(msg,isError=false){
messageBox.style.display="block";
messageBox.textContent=msg;
messageBox.style.color=isError?"#ffb3b3":"#b6ffb3";
setTimeout(()=>{messageBox.style.display="none"},4000);
}

function showSignup(){
loginForm.style.display="none";
forgotForm.style.display="none";
signupForm.style.display="block";
}

function showLogin(){
signupForm.style.display="none";
forgotForm.style.display="none";
loginForm.style.display="block";
}

function showForgot(){
loginForm.style.display="none";
signupForm.style.display="none";
forgotForm.style.display="block";
}

/* LOGIN */
loginForm.addEventListener("submit",async e=>{
e.preventDefault();
try{
const res=await fetch(`${API_BASE_URL}/login`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:loginEmail.value,
password:loginPassword.value
})
});
const data=await res.json().catch(()=>({}));
if(!res.ok) return showMessage(data.message||"Login failed",true);
showMessage("Login successful");
loginForm.reset();
}catch(err){showMessage("Server error",true);}
});

/* SIGNUP */
signupForm.addEventListener("submit",async e=>{
e.preventDefault();
try{
const res=await fetch(`${API_BASE_URL}/register`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:signupName.value,
username:signupUsername.value,
phone:signupPhone.value,
email:signupEmail.value,
password:signupPassword.value
})
});
const data=await res.json().catch(()=>({}));
if(!res.ok) return showMessage(data.message||"Signup failed",true);
showMessage("Account created successfully");
signupForm.reset();
showLogin();
}catch(err){showMessage("Server error",true);}
});

/* OTP FLOW */
async function sendOTP(){
try{
const res=await fetch(`${API_BASE_URL}/forgot-password`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:forgotEmail.value})
});
const data=await res.json().catch(()=>({}));
if(!res.ok) return showMessage(data.message||"OTP send failed",true);
otpSection.style.display="block";
newPassSection.style.display="block";
showMessage("OTP sent");
}catch(err){showMessage("Server error",true);}
}

async function resetPassword(){
try{
const res=await fetch(`${API_BASE_URL}/reset-password`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:forgotEmail.value,
otp:otpInput.value,
new_password:newPassword.value
})
});
const data=await res.json().catch(()=>({}));
if(!res.ok) return showMessage(data.message||"Update failed",true);
showMessage("Password updated");
forgotForm.reset();
otpSection.style.display="none";
newPassSection.style.display="none";
showLogin();
}catch(err){showMessage("Server error",true);}
}
</script>

</body>
</html>
